name: ParaBank E2E

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      scope:
        description: "Escopo de testes"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke
          - login
          - registration
          - transfer

      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit


concurrency:
  group: parabank-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: read
  actions: read
  pages: write
  id-token: write


env:
  PYTHONUNBUFFERED: "1"

  BASE_URL: "https://parabank.parasoft.com/parabank"

  HEADLESS: "true"

  PW_TIMEOUT_MS: "10000"
  PW_NAVIGATION_TIMEOUT_MS: "15000"

  # O ambiente remoto pode responder mais lentamente que o local.
  REQUEST_TIMEOUT_SECONDS: "30"

  BACKEND_TRANSPORT: "proxy"
  BROWSER_TRANSPORT: "direct"

  BLOCK_NONESSENTIAL_RESOURCES: "true"
  UI_SCENARIO_DELAY_SECONDS: "2.0"

  SCRAPE_DO_API_URL: "https://api.scrape.do/"
  SCRAPE_DO_PROXY_URL: "http://proxy.scrape.do:8080"
  SCRAPE_DO_BROWSER_PROXY_PARAMS: "render=false"

  SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}


jobs:

  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      pages_ready: ${{ steps.pages_upload.outcome }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt


      - name: Validate SCRAPE_DO_TOKEN
        shell: bash
        run: |
          if [[ -z "${SCRAPE_DO_TOKEN}" ]]; then
            echo "::error::SCRAPE_DO_TOKEN is not configured."
            echo "::error::Configure the repository secret SCRAPE_DO_TOKEN."
            exit 1
          fi

          echo "SCRAPE_DO_TOKEN is configured."
          echo "The secret value will not be displayed."


      - name: Resolve execution configuration
        id: execution
        shell: bash
        run: |
          scope="full"
          browser="chromium"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scope="smoke"
            browser="chromium"
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            scope="full"
            browser="chromium"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
            browser="${{ inputs.browser }}"
          fi

          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "browser=${browser}" >> "$GITHUB_OUTPUT"

          echo
          echo "============================================"
          echo "Execution configuration"
          echo "============================================"
          echo "Event   : ${{ github.event_name }}"
          echo "Scope   : ${scope}"
          echo "Browser : ${browser}"
          echo "============================================"
          echo


      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Install Playwright browser
        shell: bash
        run: |
          browser="${{ steps.execution.outputs.browser }}"

          echo "Installing Playwright browser: ${browser}"

          python -m playwright install \
            --with-deps \
            "${browser}"


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"


      - name: Install Allure Report
        shell: bash
        run: |
          echo "Installing Allure Report..."

          npm install -g allure

          echo
          echo "Allure version:"
          allure --version


      - name: Run automated tests
        id: tests
        shell: bash
        run: |
          scope="${{ steps.execution.outputs.scope }}"
          browser="${{ steps.execution.outputs.browser }}"

          args=(
            --skip-setup
            --browser "$browser"
          )

          case "$scope" in

            smoke)
              args+=(
                --tags
                "@smoke"
              )
              ;;

            login)
              args+=(
                --scope
                login
              )
              ;;

            registration)
              args+=(
                --scope
                registration
              )
              ;;

            transfer)
              args+=(
                --scope
                transfer
              )
              ;;

            full)
              ;;

            *)
              echo "::error::Unknown test scope: $scope"
              exit 1
              ;;
          esac

          echo
          echo "============================================"
          echo "Running ParaBank Automation"
          echo "============================================"
          echo "Scope   : $scope"
          echo "Browser : $browser"
          echo "Mode    : headless"
          echo "============================================"
          echo

          set +e

          python scripts/run.py "${args[@]}"

          test_exit_code=$?

          set -e

          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"

          echo
          echo "============================================"
          echo "Test execution finished"
          echo "Exit code: ${test_exit_code}"
          echo "============================================"
          echo

          # Mantém o workflow vivo para gerar evidências.
          exit 0


      - name: Generate Allure Report
        id: allure
        if: always()
        shell: bash
        run: |
          echo "Checking Allure results..."

          if [[ ! -d "reports/allure-results" ]]; then
            echo "No allure-results directory found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! find reports/allure-results \
              -type f \
              -print \
              -quit | grep -q .; then

            echo "No Allure result files found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo
          echo "Generating Allure Report..."
          echo

          rm -rf reports/allure-report

          allure generate \
            reports/allure-results \
            --output reports/allure-report

          if [[ ! -f "reports/allure-report/index.html" ]]; then
            echo "::error::Allure Report was not generated correctly."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "generated=true" >> "$GITHUB_OUTPUT"

          echo
          echo "============================================"
          echo "Allure Report generated successfully"
          echo "============================================"
          echo "Results: reports/allure-results"
          echo "Report : reports/allure-report"
          echo "============================================"


      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_number }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 7


      - name: Upload Allure HTML Report
        if: >
          always() &&
          steps.allure.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report
          if-no-files-found: error
          retention-days: 14


      # GitHub Pages é opcional.
      #
      # Caso ainda não esteja habilitado em Settings -> Pages,
      # este step pode falhar sem derrubar o CI.
      - name: Configure GitHub Pages
        id: pages_config
        continue-on-error: true
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.allure.outputs.generated == 'true'
        uses: actions/configure-pages@v6


      - name: Warn when GitHub Pages is unavailable
        if: >
          always() &&
          steps.pages_config.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository."
          echo "::warning::Go to Settings > Pages and select GitHub Actions as Source."
          echo "The Allure Report is still available as a workflow artifact."


      - name: Upload GitHub Pages artifact
        id: pages_upload
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.allure.outputs.generated == 'true' &&
          steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report


      - name: Final test status
        if: always()
        shell: bash
        run: |
          test_exit_code="${{ steps.tests.outputs.exit_code }}"

          if [[ -z "$test_exit_code" ]]; then
            echo "::error::Test execution did not return an exit code."
            exit 1
          fi

          if [[ "$test_exit_code" != "0" ]]; then
            echo
            echo "::error::Automated tests failed."
            echo "Behave exit code: $test_exit_code"
            echo

            exit "$test_exit_code"
          fi

          echo
          echo "============================================"
          echo "Automated tests passed successfully."
          echo "============================================"


  deploy-report:
    name: Publish Allure Report

    needs:
      - test

    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.outputs.pages_ready == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5