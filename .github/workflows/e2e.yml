name: ParaBank E2E

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      scope:
        description: "Escopo de testes"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke
          - login
          - registration
          - transfer
      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

concurrency:
  group: parabank-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  LOCAL_BASE_URL: "http://localhost:8080/parabank"
  LOCAL_STARTUP_TIMEOUT_SECONDS: "180"
  PW_TIMEOUT_MS: "10000"
  PW_NAVIGATION_TIMEOUT_MS: "15000"
  REQUEST_TIMEOUT_SECONDS: "30"
  BLOCK_NONESSENTIAL_RESOURCES: "true"
  UI_SCENARIO_DELAY_SECONDS: "0"

jobs:
  regression:
    name: Regression Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Resolve execution configuration
        id: execution
        shell: bash
        run: |
          scope="full"
          browser="chromium"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
            browser="${{ inputs.browser }}"
          fi

          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "browser=${browser}" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "Regression configuration"
          echo "============================================"
          echo "Event   : ${{ github.event_name }}"
          echo "Scope   : ${scope}"
          echo "Browser : ${browser}"
          echo "SUT     : local Docker ParaBank"
          echo "============================================"

      - name: Verify Docker runtime
        shell: bash
        run: |
          docker --version
          docker info
          docker compose version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static analysis with Ruff
        shell: bash
        run: python -m ruff check .

      - name: Validate Ruff formatting
        shell: bash
        run: python -m ruff format --check .

      - name: Validate BDD step bindings
        shell: bash
        run: python -m behave --dry-run --format=plain --no-summary

      - name: Install Playwright browser
        shell: bash
        run: |
          browser="${{ steps.execution.outputs.browser }}"
          python -m playwright install --with-deps "$browser"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Allure Report
        shell: bash
        run: |
          npm install -g allure
          allure --version

      - name: Run regression
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          scope="${{ steps.execution.outputs.scope }}"
          browser="${{ steps.execution.outputs.browser }}"

          args=(
            --skip-setup
            --no-docker-install
            --browser "$browser"
          )

          case "$scope" in
            smoke)
              args+=(--tags "@smoke")
              ;;
            login)
              args+=(--scope login)
              ;;
            registration)
              args+=(--scope registration)
              ;;
            transfer)
              args+=(--scope transfer)
              ;;
            full)
              ;;
            *)
              echo "::error::Unknown test scope: $scope"
              exit 1
              ;;
          esac

          python scripts/run.py "${args[@]}"

      - name: Generate Allure Report
        id: allure
        if: always()
        shell: bash
        run: |
          if [[ ! -d "reports/allure-results" ]] || \
             ! find reports/allure-results -type f -print -quit | grep -q .; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results were produced."
            exit 0
          fi

          rm -rf reports/allure-report
          allure generate \
            reports/allure-results \
            --output reports/allure-report

          test -f reports/allure-report/index.html
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_number }}-${{ steps.execution.outputs.browser }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Allure HTML Report
        if: >
          always() &&
          steps.allure.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Final regression status
        if: always()
        shell: bash
        run: |
          test_outcome="${{ steps.tests.outcome }}"

          if [[ "$test_outcome" != "success" ]]; then
            echo "::error::Regression test step finished with outcome: ${test_outcome}."
            exit 1
          fi

          echo "Regression quality gate passed."

  cross-browser-smoke:
    name: Smoke - ${{ matrix.browser }}
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Verify Docker runtime
        shell: bash
        run: |
          docker info
          docker compose version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        shell: bash
        run: |
          python -m playwright install \
            --with-deps \
            "${{ matrix.browser }}"

      - name: Run smoke suite
        shell: bash
        run: |
          python scripts/run.py \
            --skip-setup \
            --no-docker-install \
            --browser "${{ matrix.browser }}" \
            --tags "@smoke"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.browser }}-${{ github.run_number }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 7

  deploy-report:
    name: Publish Allure Report
    needs:
      - regression
      - cross-browser-smoke

    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success' &&
      needs.cross-browser-smoke.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure report artifact
        uses: actions/download-artifact@v8
        with:
          name: allure-report-${{ github.run_number }}
          path: reports/allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report

      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
