name: ParaBank E2E

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      scope:
        description: "Escopo de testes"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - smoke
          - login
          - registration
          - transfer

      browser:
        description: "Browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit


concurrency:
  group: parabank-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  actions: read
  pages: write
  id-token: write


env:
  PYTHONUNBUFFERED: "1"
  LOCAL_BASE_URL: "http://localhost:8080/parabank"
  LOCAL_STARTUP_TIMEOUT_SECONDS: "180"
  PW_TIMEOUT_MS: "10000"
  PW_NAVIGATION_TIMEOUT_MS: "15000"
  REQUEST_TIMEOUT_SECONDS: "30"
  BLOCK_NONESSENTIAL_RESOURCES: "true"
  UI_SCENARIO_DELAY_SECONDS: "0"


jobs:
  regression:
    name: Regression Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      pages_ready: ${{ steps.pages_upload.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Resolve execution configuration
        id: execution
        shell: bash
        run: |
          scope="full"
          browser="chromium"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
            browser="${{ inputs.browser }}"
          fi

          echo "scope=${scope}" >> "$GITHUB_OUTPUT"
          echo "browser=${browser}" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "Regression configuration"
          echo "============================================"
          echo "Event   : ${{ github.event_name }}"
          echo "Scope   : ${scope}"
          echo "Browser : ${browser}"
          echo "SUT     : local Docker ParaBank"
          echo "============================================"

      - name: Verify Docker runtime
        shell: bash
        run: |
          docker --version
          docker info
          docker compose version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python source syntax
        shell: bash
        run: |
          python -m compileall \
            config \
            features \
            pages \
            scripts \
            services \
            utils

      - name: Install Playwright browser
        shell: bash
        run: |
          browser="${{ steps.execution.outputs.browser }}"
          python -m playwright install --with-deps "$browser"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Allure Report
        shell: bash
        run: |
          npm install -g allure@3.17.0
          allure --version

      - name: Run regression
        id: tests
        shell: bash
        run: |
          scope="${{ steps.execution.outputs.scope }}"
          browser="${{ steps.execution.outputs.browser }}"

          args=(
            --skip-setup
            --no-docker-install
            --browser "$browser"
          )

          case "$scope" in
            smoke)
              args+=(--tags "@smoke")
              ;;
            login)
              args+=(--scope login)
              ;;
            registration)
              args+=(--scope registration)
              ;;
            transfer)
              args+=(--scope transfer)
              ;;
            full)
              ;;
            *)
              echo "::error::Unknown test scope: $scope"
              exit 1
              ;;
          esac

          set +e
          python scripts/run.py "${args[@]}"
          test_exit_code=$?
          set -e

          echo "exit_code=${test_exit_code}" >> "$GITHUB_OUTPUT"

          # Mantém o job vivo para publicar as evidências mesmo em falha.
          exit 0

      - name: Generate branded Allure Report
        id: allure
        if: always()
        shell: bash
        run: |
          if [[ ! -d "reports/allure-results" ]] || \
             ! find reports/allure-results -type f -print -quit | grep -q .; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results were produced."
            exit 0
          fi

          rm -rf reports/allure-report

          set +e
          allure generate \
            reports/allure-results \
            --config ./allurerc.yml \
            --output reports/allure-report
          allure_exit_code=$?
          set -e

          if [[ "$allure_exit_code" != "0" ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::error::Allure report generation failed with exit code ${allure_exit_code}."

            latest_log="$(ls -1t "$HOME"/.allure/logs/*.log 2>/dev/null | head -n 1 || true)"

            if [[ -n "$latest_log" ]]; then
              echo "::group::Allure diagnostic log"
              cat "$latest_log"
              echo "::endgroup::"
            fi

            exit "$allure_exit_code"
          fi

          test -f reports/allure-report/index.html
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.run_number }}-${{ steps.execution.outputs.browser }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload branded Allure HTML Report
        if: >
          always() &&
          steps.allure.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: topaz-allure-report-${{ github.run_number }}-${{ steps.execution.outputs.browser }}
          path: reports/allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        id: pages_config
        continue-on-error: true
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.allure.outputs.generated == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        id: pages_upload
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.allure.outputs.generated == 'true' &&
          steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report

      - name: Final regression status
        if: always()
        shell: bash
        run: |
          test_exit_code="${{ steps.tests.outputs.exit_code }}"

          if [[ -z "$test_exit_code" ]]; then
            echo "::error::Test execution did not return an exit code."
            exit 1
          fi

          if [[ "$test_exit_code" != "0" ]]; then
            echo "::error::Regression failed with exit code ${test_exit_code}."
            exit "$test_exit_code"
          fi

          echo "Regression quality gate passed."


  cross-browser-smoke:
    name: Smoke - ${{ matrix.browser }}
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Verify Docker runtime
        shell: bash
        run: |
          docker info
          docker compose version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        shell: bash
        run: |
          python -m playwright install \
            --with-deps \
            "${{ matrix.browser }}"

      - name: Run smoke suite
        shell: bash
        run: |
          python scripts/run.py \
            --skip-setup \
            --no-docker-install \
            --browser "${{ matrix.browser }}" \
            --tags "@smoke"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.browser }}-${{ github.run_number }}
          path: reports/allure-results
          if-no-files-found: warn
          retention-days: 7


  deploy-report:
    name: Publish Allure Report
    needs:
      - regression
      - cross-browser-smoke

    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.regression.result == 'success' &&
      needs.cross-browser-smoke.result == 'success' &&
      needs.regression.outputs.pages_ready == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
